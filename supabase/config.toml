# 這三個 Edge Function 都刻意關閉 JWT 驗證（verify_jwt = false）：
# - line-webhook 由 LINE 平台呼叫，不會帶 Supabase JWT；改用 x-line-signature 簽章驗證（需設定 LINE_CHANNEL_SECRET）。
# - send-line-notification / bind-line-booking 由前端（匿名訪客）呼叫，防濫用靠函式內部的檢查，而不是 JWT：
#   send-line-notification 只接受訂單編號、內容由資料庫組成、10 分鐘內新單且只通知一次。
[functions.line-webhook]
verify_jwt = false

[functions.send-line-notification]
verify_jwt = false

[functions.bind-line-booking]
verify_jwt = false
